[project]
name = "muse-glasses"
version = "0.1.0"
description = "Talk to your Muse from Meta Ray-Ban Display glasses: macOS Muse gadget + bridge + glasses web app"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "bless>=0.2.6", "cryptography>=3.3.2", "websockets>=13"]

[project.optional-dependencies]
test = ["pytest", "pytest-aiohttp", "pytest-asyncio"]
qr = ["qrcode[pil]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "vendor/muse-gadget-sdk/linux/src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Meta's SDK (vendor/) is not packaged here: it runs from its pinned checkout via PYTHONPATH.
packages = ["muse_bridge", "musegadget_mac"]
